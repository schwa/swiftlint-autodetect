[package]
name = "swiftlint-autodetect"
version = "0.1.4"
edition = "2021"
license = "MIT"
description = "Automatically generate Swiftlint rules from your codebase."
url = "https://github.com/schwa/swiftlint-autodetect"
repository = "https://github.com/schwa/swiftlint-autodetect"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
colored_markup = "0.1.1"
hashlink = "0.8.4"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_norway = "0.9.42"
shellexpand = "3.1.1"
tempfile = "3.23.0"
toml = "0.8.23"
yaml-rust2 = "0.8.1"
